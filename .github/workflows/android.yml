name: Android Build

on:
  push:
    branches: [ birlesik-apk ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
    steps:
      - name: Checkout engine
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies (engine)
        run: bash scripts/gha/deps_android.sh

      - name: Build engine APK
        run: bash scripts/gha/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
