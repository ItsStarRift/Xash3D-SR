name: Android Build

on:
  push:
    branches: [ birlesik-apk ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SDL_VERSION: 2.32.10
    steps:
      - name: Checkout engine
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Checkout CS16Client
        uses: actions/checkout@v5
        with:
          repository: ItsStarRift/CS16Client-SR
          path: cs16client
          submodules: recursive

      - name: Install dependencies (engine)
        run: bash scripts/gha/deps_android.sh

      - name: Build CS16Client native libs
        run: |
          unset ANDROID_SDK_ROOT
          export JAVA_HOME=$GITHUB_WORKSPACE/java
          export ANDROID_HOME=$GITHUB_WORKSPACE/sdk
          export PATH=$PATH:$JAVA_HOME/bin
          cd cs16client/android
          for ABI in arm64-v8a armeabi-v7a; do
            echo "=== $ABI derleniyor ==="
            ./gradlew assembleGitDebug --no-daemon -Pandroid.injected.build.abi=$ABI
            SRC=app/build/intermediates/merged_native_libs/gitDebug/mergeGitDebugNativeLibs/out/lib/$ABI
            DST=$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$ABI
            mkdir -p $DST
            cp $SRC/*.so $DST/
            echo "=== $ABI kopyalandi ==="
            ls -la $DST
            ./gradlew clean --no-daemon
          done

      - name: Check CS16Client assets
        run: |
          echo "=== assets klasoru ==="
          find cs16client/android/app/src/main/assets -maxdepth 2 2>&1 | head -60

      - name: Merge CS16Client assets into xash-extras
        run: |
          echo "=== xash-extras icerigi (ilk 60) ==="
          find 3rdparty/extras/xash-extras -maxdepth 3 | head -60
          echo "=== cakisan dosyalar ==="
          comm -12 \
            <(cd 3rdparty/extras/xash-extras && find . -type f | sort) \
            <(cd cs16client/android/app/src/main/assets && find . -type f | sort)
          cp -rf cs16client/android/app/src/main/assets/. 3rdparty/extras/xash-extras/
          echo "=== birlesik xash-extras ==="
          find 3rdparty/extras/xash-extras -maxdepth 2 | head -40

      - name: Build engine APK
        run: bash scripts/gha/build_android.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/*.apk
